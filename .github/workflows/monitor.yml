name: SEC Form 144 Real-time Monitor

on:
  schedule:
    # 美东时间周一至周五 22:00
    # 当前采用夏令时对应的 UTC 时间
    - cron: '0 2 * * 2-6'

  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser curl_cffi requests yfinance beautifulsoup4

      - name: Execute Script
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
        run: python monitor.py

      - name: Sync Cache to Repo
        run: |
          git config --global user.name "Bot-Monitor"
          git config --global user.email "bot@monitor.com"

          touch seen_ids.txt

          git add seen_ids.txt

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update seen_ids [skip ci]"
            git push
          fi
